<div style="padding: 20px;">
    <!-- Вызов компонента Counter -->
    <app-counter></app-counter>

    <hr style="margin: 30px 0;" />

    <div class="status-container">
        <!-- Индивидуальные всплывающие статусы при удалении/сохранении -->
        @if (statusMessage()) {
        <div [class.error-box]="isError()" [class.status-box]="!isError()">
            {{ statusMessage() }}
        </div>
        }
    </div>

    <!-- Передаем состояние rxResource внутрь таблицы -->
    <app-user-table [users]="users()" [isLoading]="isLoading()" [isResourceError]="isResourceError()"
        [currentPage]="page()" [totalPages]="totalPages()" [totalElements]="totalElements()" [search]="search()"
        (pageChange)="page.set($event)" (save)="handleSave($event)" (delete)="handleDelete($event)"
        (retry)="refreshData()" (searchChange)="handleSearch($event)" (sortChange)="handleSort($event)" />
</div>
